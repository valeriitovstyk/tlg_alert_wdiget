<style>
body{color-scheme:light dark;margin:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));font:15px/1.25 system-ui,sans-serif}
.c{border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--tg-theme-secondary-bg-color);box-shadow:inset 0 0 0 2px #209c05}
.c.a{box-shadow:inset 0 0 0 2px #ff0a0a;background:rgba(255,10,10,.12)}
.h{display:flex;justify-content:space-between;align-items:baseline}
.n{font-size:20px;font-weight:800}
.s{font-size:28px;font-weight:900;color:light-dark(#209c05,#85e62c);line-height:1.1}
.a .s{color:#ff0a0a}
.m,.f{color:var(--tg-theme-hint-color);font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.t{border-radius:10px;padding:6px 8px;background:rgba(127,127,127,.12)}
.v{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.v.z{color:var(--tg-theme-hint-color)}.v.x{color:#ff0a0a}
.l{font-size:12px;color:var(--tg-theme-hint-color)}
.b{margin-top:6px;border-radius:10px;padding:7px 9px;font-weight:800;font-size:14px;background:rgba(127,127,127,.12);color:var(--tg-theme-hint-color)}
.b.o{background:#ff0a0a;color:#fff}
.w{display:inline-block;margin-bottom:8px;background:#f2ce02;color:#1a1a1a;font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px;margin-top:4px}
.o2{background:#ebff0a;color:#1a1a1a;border-radius:6px;padding:0 5px}
.f a{color:var(--tg-theme-link-color)}
</style>
<div id="k"></div><div id="l"></div><div class="w" id="x" style="display:none"></div><div class="f" id="u"></div>
<div class="f">Дані: <a href="https://neptun.in.ua/">NEPTUN</a>. Не офіційне оповіщення.</div>
<script>
const TW=window.TelegramWidget,$=i=>document.getElementById(i),N=['Київ','Львів'];
let S=null,R=-1;
function rd(){try{const s=JSON.parse(TW&&TW.publicData);if(s&&s.r>=R){S=s;R=s.r}}catch(e){}}
const ago=t=>{const m=Math.max(0,Math.floor((Date.now()/1e3-t)/60));return m<60?m+' хв':Math.floor(m/60)+' год '+m%60+' хв'};
const hm=t=>new Date(t*1e3).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
const tl=(v,l)=>'<div class="t"><div class="v '+(v?'x':'z')+'">'+v+'</div><div class="l">'+l+'</div></div>';
function city(el,n,c,mig){
 if(!c){el.className='c';el.innerHTML='<div class="n">'+n+'</div><div class="m">немає даних</div>';return}
 const[a,since,d,dn,mi,mn,kab,bal,eta=-1,bm=-1]=c,ag=m=>m>0?m+' хв тому':'щойно';
 el.className='c'+(a?' a':'');
 let h='<div class="h"><div class="n">'+n+'</div><div class="m">'+(a&&since?'з '+hm(since)+' · '+ago(since):'')+'</div></div>';
 if(a){h+='<div class="s">ТРИВОГА</div><div class="g">'+tl(d,'шахедів курсом'+(dn?' · '+dn+' поруч':''))+tl(mi,'ракет курсом'+(mn?' · '+mn+' поруч':''))+tl(kab,'КАБів')+'</div>'
  +(eta>0?'<div class="m">⏱ найближчий шахед ~'+eta+' хв</div>':'')+'<div class="b'+(bal||mig?' o':'')+'">'+(bal?'⚠️ Загроза балістики':mig?'⚠️ МіГ-31К у повітрі':'Балістики не видно')+'</div>'}
 else{h+='<div class="s">Тривоги немає</div>';const x=[];if(d)x.push(d+' шахед. курсом'+(eta>0?' ~'+eta+' хв':eta==0?', поруч':''));if(mi)x.push(mi+' ракет курсом');if(bal)x.push('загроза балістики');if(x.length)h+='<div class="w">Але: '+x.join(', ')+'</div>'}
 if(bm>=0)h+='<div class="m">💥 вибухи / ППО, '+ag(bm)+' (канали)</div>';el.innerHTML=h}
function draw(){
 const c=S&&S.c||[],g=S&&S.g||[0,0,0,0];
 city($('k'),N[0],c[0],g[3]);city($('l'),N[1],c[1],g[3]);
 const L={o:'Орєшнік',k:'Кинджали',t:'Ту-95/160/22',c:'Калібри'},st=S&&S.s||[];$('x').style.display=st.length?'block':'none';$('x').textContent='⚠️ З каналів: '+st.map(z=>L[z[0]]+' ('+(z[1]>0?z[1]+' хв':'щойно')+')').join(', ');
  const old=S&&Date.now()/1e3-S.t>180;
 $('u').innerHTML=S?(old?'<span class="o2">Дані застарілі</span> ':'')+'оновлено о '+hm(S.t)+(TW&&TW.isForward?' (копія)':''):'Чекаю на дані від бота…'}
rd();draw();
if(TW){TW.onEvent('publicDataChanged',()=>{rd();draw()});TW.watchPublicData&&TW.watchPublicData();TW.ready&&TW.ready()}
setInterval(draw,30000);
</script>
