name: alert-bot

# Бот працює безперервно: кожен запуск живе ~5 год 50 хв і на старті сам ставить у чергу
# наступний (workflow_dispatch), який стартує одразу після нього. Розклад GitHub ненадійний
# (запізнюється й пропускає запуски), тому він лише запасний варіант на випадок збою.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: alert-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install -q google-auth requests
      - name: Bot
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ vars.CHAT_IDS }}
          BOT_API: ${{ vars.BOT_API || 'https://api.telegram.org' }}
          RUN_FOR_S: "21000"
          STATE_FILE: bot/state.json
          TZ: Europe/Kyiv
        run: python3 bot/bot.py
      - name: Save state
        if: always()
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add bot/state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "bot state" && git pull --rebase -q && git push -q)
