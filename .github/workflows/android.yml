name: android-apk

# Збирає APK віджета «Київ» і викладає його в реліз «apk»:
# https://github.com/valeriitovstyk/tlg_alert_wdiget/releases/download/apk/KyivAlert.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрету ANDROID_KEYSTORE_B64 немає — APK підписаний тимчасовим ключем, оновлення поверх не встановиться."
          fi
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: kyivalert-widget
        run: |
          gradle -p android --no-daemon assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk KyivAlert.apk
          if [ ! -f android/app/google-services.json ]; then echo "::warning::Немає android/app/google-services.json — пуші в цій збірці вимкнені."; fi
      - uses: actions/upload-artifact@v4
        with:
          name: KyivAlert
          path: KyivAlert.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Віджет «Київ» (Android)" --notes "Завантажити на телефоні: KyivAlert.apk нижче."
          gh release upload apk KyivAlert.apk --clobber
          gh release edit apk --notes "Збірка ${{ github.run_number }} ($(git rev-parse --short HEAD)). Завантажити на телефоні: KyivAlert.apk нижче."
